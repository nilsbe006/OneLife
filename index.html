<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d0a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Two friends. One bucketlist. Countless adventures.">
  <title>ONE LIFE. NO LIMITS.</title>
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ladezustand, bis Firebase die Session geprüft hat -->
  <div id="screen-loading" class="screen screen-loading" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <span class="sr-only">Lade …</span>
  </div>

  <!-- Login -->
  <div id="screen-login" class="screen screen-login" hidden>
    <div class="login-bg" aria-hidden="true"></div>
    <form id="login-form" class="login-card" novalidate>
      <p class="eyebrow">Adventure Planner</p>
      <h1 class="display login-title">One life.<br>No limits.</h1>
      <p class="login-sub">Two friends. One bucketlist. Countless adventures.</p>

      <label class="field">
        <span>E-Mail</span>
        <input id="login-email" type="email" name="email" autocomplete="username" inputmode="email" required placeholder="du@beispiel.de">
      </label>

      <label class="field">
        <span>Passwort</span>
        <div class="field-pw">
          <input id="login-password" type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Passwort anzeigen">Zeigen</button>
        </div>
      </label>

      <label class="check">
        <input id="login-remember" type="checkbox" checked>
        <span>Angemeldet bleiben</span>
      </label>

      <p id="login-error" class="form-error" role="alert" hidden></p>
      <p id="login-info" class="form-info" role="status" hidden></p>

      <button id="login-submit" type="submit" class="btn btn-primary btn-block btn-lg">Unlock Adventure</button>
      <button id="login-reset" type="button" class="link-btn">Passwort vergessen?</button>
    </form>
    <p class="login-credit">Foto: Unsplash</p>
  </div>

  <!-- App -->
  <div id="screen-app" class="screen screen-app" hidden>
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Zur Startseite">ONE LIFE<span>.</span></a>
      <div class="topbar-user">
        <span id="user-chip" class="user-chip"></span>
        <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Logout</button>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
